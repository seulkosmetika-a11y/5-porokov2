<title>Тест: выраженность пороков команды</title>

<style>
  :root{

    padding:32px 28px;

    align-items:center;
    gap:3px;
    margin:28px 0 8px;
  }

    height:30px;
    border-radius:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--paper);
    background:#C9C2AC;

    width:100%;
    text-align:center;
    padding:0 8px;

    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:2px;
    font-family:inherit;
    font-size:15px;
    background:var(--bg);
    color:var(--ink);

  input[type=text]:focus{ outline:2px solid var(--accent); outline-offset:1px; }

    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    border:none;
    border-radius:2px;
  }
  .btn-primary{
    background:var(--ink);
    color:var(--paper);
    padding:13px 26px;
    margin-top:26px;
    width:100%;
  }
  .btn-primary:hover{ background:#333a52; }
  .btn-primary:disabled{ background:#B5B9C6; cursor:not-allowed; }
  .btn-secondary{
    background:transparent;
    color:var(--ink-soft);
    padding:10px 18px;
    border:1px solid var(--line);
  }

  .progress-track{
    height:4px;
    background:var(--line);
    border-radius:2px;
    margin:0 0 30px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width 0.3s ease;
  }
  .q-meta{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin-bottom:12px;
  }

    font-family:'Fraunces', serif;
    font-size:21px;
    font-weight:500;
    line-height:1.35;
    margin-bottom:24px;

    margin-bottom:10px;
    font-size:14.5px;
    line-height:1.45;
    background:var(--bg);
    transition:all 0.15s ease;

  .choice-opt.selected{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

  .nav-row .btn-primary{ margin-top:0; }

  .tag-high{ background:var(--high-bg); color:var(--high); }
  .vice-bar-track{ height:6px; background:var(--bg); border-radius:3px; margin:10px 0; overflow:hidden;}

  }
  .status-note.ok{ color:var(--low); }
  .status-note.err{ color:var(--high); }

// Перемешиваем варианты ответов один раз при загрузке страницы,
// чтобы порядок не выдавал, какой вариант к какому пороку относится.
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
QUESTIONS.forEach(q => { q.options = shuffle(q.options); });

    low: 'Ты обычно спокойно вступаешь в спор по сути дела. В игре можешь стать тем, кто честно называет разногласие, вместо того чтобы его сглаживать.',
    mid: 'Ты не всегда решаешься открыто поспорить, особенно если атмосфера напряжённая. В игре последи, не соглашаешься ли ты просто для того, чтобы не спорить.',
    high: 'Тебе особенно свойственно уходить от открытого конфликта. В игре обрати внимание, не переносишь ли ты разногласия в кулуары вместо того, чтобы озвучить их сразу.'
  },
  commitment: {
    low: 'Ты обычно искренне поддерживаешь принятые решения, даже если был не до конца согласен. В игре можешь помогать команде чётко фиксировать договорённости.',
    mid: 'Иногда ты соглашаешься формально, не до конца разделяя решение. В игре последи, не киваешь ли ты «для вида», планируя всё равно сделать по-своему.',
    high: 'Тебе особенно свойственно не до конца принимать решения команды. В игре обрати внимание на моменты «да, но…» — и что мешает сказать это прямо во время обсуждения.'
  },
  accountability: {
    low: 'Тебе обычно несложно сказать коллеге напрямую, если что-то пошло не так. В игре можешь стать тем, кто называет то, что другие замечают, но не проговаривают.',
    mid: 'Иногда тебе проще промолчать о чужой ошибке, чем дать обратную связь напрямую. В игре последи, не перекладываешь ли ты эту задачу на кого-то «более подходящего».',
    high: 'Тебе особенно сложно давать прямую обратную связь и предъявлять требования коллегам. В игре обрати внимание на моменты, когда легче смолчать или сделать за другого, чем сказать прямо.'
  },
  results: {
    low: 'Общий результат команды для тебя обычно важнее личных очков. В игре можешь напоминать другим о совместной цели, когда фокус начинает смещаться.',
    mid: 'Иногда личный интерес или репутация всё же перевешивают общую цель. В игре последи, не отвлекаешься ли ты от результата команды в пользу своего собственного вклада.',
    high: 'Тебе особенно свойственно ставить личные интересы выше общего результата. В игре обрати внимание на моменты, когда легче «выиграть свою битву», чем помочь выиграть команде.'
  }
};

const ANTIDOTES = {
  trust: '«Если честно, я не уверен на этот счёт — можете помочь?»',
  conflict: '«У меня другое мнение, и вот почему…»',
  commitment: '«Правильно понимаю: мы договорились, что…?»',
  accountability: '«Смотри, вот тут не сходится — давай вместе поправим»',
  results: '«А что сейчас важнее для общего результата?»'
};

function buildConclusion(scores, healthyCount, total){
  const max = Math.max(...VICE_ORDER.map(v=>scores[v]));
  if (max === 0){
    return {
      title: '—',
      body: 'По твоим ответам ни один порок не проявился явно сильнее остальных — сегодня, скорее всего, стоит просто наблюдать за собой в игре без заранее заданного фокуса.',
      antidote: null
    };
  }
  const top = VICE_ORDER.filter(v=>scores[v]===max);
  const title = top.map(v=>VICE_LABEL[v]).join(' и ');

  let body = '';
  if (top.length === 1){
    body = `Судя по ответам, сегодня у тебя сильнее всего проявляется «${VICE_LABEL[top[0]]}» (${scores[top[0]]} из ${total} ситуаций). ${INTERPRETATIONS[top[0]].high}`;
  } else {
    const parts = top.map(v => `«${VICE_LABEL[v]}»`).join(' и ');
    body = `Судя по ответам, у тебя примерно поровну проявляются ${parts} (по ${max} из ${total} ситуаций) — сегодня стоит присмотреться сразу к обоим. ${top.map(v=>INTERPRETATIONS[v].high).join(' ')}`;
  }

  if (healthyCount >= 7){
    body += ` При этом больше чем в половине ситуаций ты выбирал(а) прямую, открытую реакцию — в игре стоит просто аккуратно её удерживать, особенно в моменты, где это будет непросто.`;
  } else if (healthyCount <= 2){
    body += ` Почти во всех ситуациях выбор шёл в сторону избегания, а не прямого разговора — сегодня, вероятно, будет из чего поработать в игре.`;
  }

  const antidote = top.length === 1 ? ANTIDOTES[top[0]] : null;
  return { title, body, antidote };
}

function levelOf(count){
  if (count <= 1) return 'low';
  if (count === 2) return 'mid';
  return 'high';
}
const LEVEL_LABEL = { low:'Слабо выражено сегодня', mid:'На среднем уровне', high:'Заметно выражено' };
const LEVEL_COLOR = { low:'var(--low)', mid:'var(--mid)', high:'var(--high)' };
const LEVEL_TAG = { low:'tag-low', mid:'tag-mid', high:'tag-high' };

/* ============ STATE ============ */
let state = {
  screen: 'intro',
  name: '', company: '',
  qIndex: 0,
  answers: {}, // questionId -> vice
};

const app = document.getElementById('app');

/* ============ RENDER ============ */
function render(){
  if (state.screen === 'intro') return renderIntro();
  if (state.screen === 'quiz') return renderQuiz();
  if (state.screen === 'results') return renderResults();
}

function renderIntro(){
  app.innerHTML = `
    <div class="eyebrow">Перед игрой</div>
    <h1 style="font-size:30px;margin:0 0 4px;">Тест на выраженность пороков команды</h1>
    <p class="lede">12 рабочих ситуаций, 5 минут. Выбирай реакцию, которая ближе всего к тому, как ты обычно поступаешь — без «правильных» ответов. По итогу увидишь, к какому из пяти пороков команды (по книге Патрика Ленсиони) ты сегодня ближе всего, — чтобы обратить на это внимание в игре.</p>
    <div class="pyramid">
      ${VICE_ORDER.map((v,i)=>`<div class="pyr-layer pyr-w-${5-i}"><span>${VICE_LABEL[v]}</span></div>`).join('')}
    </div>
    <div class="card" style="margin-top:28px;">
      <label for="f-name">Имя</label>
      <input type="text" id="f-name" placeholder="Как к тебе обращаться" value="${state.name}">
      <label for="f-company">Компания</label>
      <input type="text" id="f-company" placeholder="Название компании" value="${state.company}">
      <button class="btn-primary" id="start-btn">Начать тест</button>
    </div>
  `;
  document.getElementById('f-name').oninput = e=> state.name = e.target.value;
  document.getElementById('f-company').oninput = e=> state.company = e.target.value;
  document.getElementById('start-btn').onclick = ()=>{
    if(!state.name.trim() || !state.company.trim()){
      alert('Пожалуйста, укажи имя и компанию.');
      return;
    }
    state.screen='quiz'; state.qIndex=0; render();
  };
}

function renderQuiz(){
  const q = QUESTIONS[state.qIndex];
  const total = QUESTIONS.length;
  const pct = Math.round((state.qIndex)/total*100);
  const selectedVice = state.answers[q.id];

  const bodyHtml = q.options.map(o=>`
    <div class="choice-opt ${selectedVice===o.vice?'selected':''}" data-vice="${o.vice}">${o.text}</div>
  `).join('');

  app.innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-meta">Ситуация ${state.qIndex+1} из ${total}</div>
    <div class="q-text">${q.text}</div>
    <div id="opts">${bodyHtml}</div>
    <div class="nav-row">
      ${state.qIndex>0 ? `<button class="btn-secondary" id="back-btn">Назад</button>` : ''}
      <button class="btn-primary" id="next-btn" ${selectedVice===undefined?'disabled':''} style="flex:1;">
        ${state.qIndex===total-1 ? 'Показать результат' : 'Далее'}
      </button>
    </div>
  `;

  document.querySelectorAll('#opts [data-vice]').forEach(el=>{
    el.onclick = ()=>{
      state.answers[q.id] = el.dataset.vice;
      render();
    };
  });
  const nextBtn = document.getElementById('next-btn');
  if(nextBtn){
    nextBtn.onclick = ()=>{
      if(state.qIndex === total-1){
        state.screen='results'; render(); submitResults();
      } else {
        state.qIndex++; render();
      }
    };
  }
  const backBtn = document.getElementById('back-btn');
  if(backBtn){ backBtn.onclick = ()=>{ state.qIndex--; render(); }; }
}

function computeScores(){
  const scores = {};
  VICE_ORDER.forEach(v=>scores[v]=0);
  Object.values(state.answers).forEach(vice=>{ scores[vice] = (scores[vice]||0) + 1; });
  return scores;
}

function renderResults(){
  const scores = computeScores();
  const total = QUESTIONS.length;
  const healthyCount = scores.healthy || 0;
  const conclusion = buildConclusion(scores, healthyCount, total);

  app.innerHTML = `
    <div class="eyebrow">Результат теста</div>
    <h1 style="font-size:28px;margin:0 0 18px;">${state.name}, вот твоё заключение</h1>

    <div class="pyramid" style="margin-bottom:14px;">
      ${VICE_ORDER.map((v,i)=>{
        const lvl = levelOf(scores[v]);
        return `<div class="pyr-layer pyr-w-${5-i} active" style="background:${LEVEL_COLOR[lvl]}"><span>${VICE_LABEL[v]}</span></div>`;
      }).join('')}
    </div>
    <p class="status-note" style="margin-bottom:26px;">В ${healthyCount} из ${total} ситуаций ты выбрал(а) прямую, конструктивную реакцию — она не привязана ни к одному пороку и в карту выше не входит.</p>

    <div class="top-banner">
      <div class="eyebrow">Твоё заключение перед игрой</div>
      <h2>${conclusion.title}</h2>
      <p>${conclusion.body}</p>
      ${conclusion.antidote ? `<p style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.15);"><strong>Фраза, которую стоит попробовать в игре:</strong><br>${conclusion.antidote}</p>` : ''}
    </div>

    <div class="eyebrow" style="margin:8px 0 14px;">Разбивка по каждому пороку</div>
    ${VICE_ORDER.map(v=>{
      const lvl = levelOf(scores[v]);
      const pct = Math.round(scores[v]/total*100);
      return `
      <div class="vice-result">
        <div class="vice-head">
          <div class="vice-name">${VICE_LABEL[v]}</div>
          <div class="vice-tag ${LEVEL_TAG[lvl]}">${LEVEL_LABEL[lvl]}</div>
        </div>
        <div class="vice-bar-track"><div class="vice-bar-fill" style="width:${pct}%; background:${LEVEL_COLOR[lvl]}"></div></div>
        <div class="vice-count">${scores[v]} из ${total} ситуаций</div>
        <div class="vice-text">${INTERPRETATIONS[v][lvl]}</div>
      </div>`;
    }).join('')}

    <div class="status-note" id="save-status">Сохраняем результат…</div>
  `;
}

/* ============ SUBMIT TO GOOGLE SHEET ============ */
async function submitResults(){
  const scores = computeScores();
  const total = QUESTIONS.length;
  const healthyCount = scores.healthy || 0;
  const conclusion = buildConclusion(scores, healthyCount, total);

  const payload = {
    name: state.name,
    company: state.company,
    trust: scores.trust,
    conflict: scores.conflict,
    commitment: scores.commitment,
    accountability: scores.accountability,
    results: scores.results,
    healthy: healthyCount,
    topVices: conclusion.title,
    conclusion: conclusion.body + (conclusion.antidote ? ` Фраза-антидот: ${conclusion.antidote}` : '')
  };

  const statusEl = ()=>document.getElementById('save-status');

  if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.indexOf('ВСТАВЬТЕ') !== -1){
    if(statusEl()){ statusEl().textContent = 'Google Таблица не подключена (заполните GOOGLE_SCRIPT_URL в коде файла) — результат показан только на экране.'; statusEl().className='status-note err'; }
    return;
  }

  try{
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'text/plain'},
      body: JSON.stringify(payload)
    });
    if(statusEl()){ statusEl().textContent = 'Результат сохранён.'; statusEl().className='status-note ok'; }
  }catch(err){
    if(statusEl()){ statusEl().textContent = 'Не удалось сохранить результат в таблицу. Сделайте скриншот экрана на всякий случай.'; statusEl().className='status-note err'; }
  }
}

render();
</script>
</body>
</html>
